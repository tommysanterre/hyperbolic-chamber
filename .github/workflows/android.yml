name: Android build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_CONFIGURED: ${{ secrets.SNACKLOOP_KEYSTORE_BASE64 != '' && secrets.SNACKLOOP_STORE_PASSWORD != '' && secrets.SNACKLOOP_KEY_ALIAS != '' && secrets.SNACKLOOP_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Run unit tests
        if: github.event_name == 'pull_request'
        run: gradle testDebugUnitTest
      - name: Check signing setup
        if: github.event_name != 'pull_request'
        run: |
          if [ "$SIGNING_CONFIGURED" != "true" ]; then
            echo "::error::Set the four SNACKLOOP signing secrets before publishing update APKs."
            exit 1
          fi
      - name: Run unit tests and build signed update APK
        if: github.event_name != 'pull_request'
        env:
          SNACKLOOP_KEYSTORE_BASE64: ${{ secrets.SNACKLOOP_KEYSTORE_BASE64 }}
          SNACKLOOP_STORE_PASSWORD: ${{ secrets.SNACKLOOP_STORE_PASSWORD }}
          SNACKLOOP_KEY_ALIAS: ${{ secrets.SNACKLOOP_KEY_ALIAS }}
          SNACKLOOP_KEY_PASSWORD: ${{ secrets.SNACKLOOP_KEY_PASSWORD }}
        run: |
          umask 077
          export SNACKLOOP_KEYSTORE_PATH="$RUNNER_TEMP/snackloop-release.jks"
          printf '%s' "$SNACKLOOP_KEYSTORE_BASE64" | base64 --decode > "$SNACKLOOP_KEYSTORE_PATH"
          version_name="0.2.${GITHUB_RUN_NUMBER}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version_name="${GITHUB_REF_NAME#v}"
          fi
          gradle testDebugUnitTest assembleRelease \
            -PsnackloopVersionCode="$((1000 + GITHUB_RUN_NUMBER))" \
            -PsnackloopVersionName="$version_name"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && success()
        with:
          name: SnackLoop-update
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SnackLoop-update
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/app-release.apk \
            --verify-tag \
            --title "SnackLoop $GITHUB_REF_NAME" \
            --generate-notes
