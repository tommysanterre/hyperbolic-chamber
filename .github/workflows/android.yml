name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_CONFIGURED: ${{ secrets.SNACKLOOP_KEYSTORE_BASE64 != '' && secrets.SNACKLOOP_STORE_PASSWORD != '' && secrets.SNACKLOOP_KEY_ALIAS != '' && secrets.SNACKLOOP_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Run unit tests
        run: gradle testDebugUnitTest
      - name: Check signing setup
        if: github.event_name != 'pull_request'
        run: |
          if [ "$SIGNING_CONFIGURED" != "true" ]; then
            echo "::error::Set the four SNACKLOOP signing secrets before publishing update APKs."
            exit 1
          fi
      - name: Build signed update APK
        if: github.event_name != 'pull_request'
        env:
          SNACKLOOP_KEYSTORE_BASE64: ${{ secrets.SNACKLOOP_KEYSTORE_BASE64 }}
          SNACKLOOP_STORE_PASSWORD: ${{ secrets.SNACKLOOP_STORE_PASSWORD }}
          SNACKLOOP_KEY_ALIAS: ${{ secrets.SNACKLOOP_KEY_ALIAS }}
          SNACKLOOP_KEY_PASSWORD: ${{ secrets.SNACKLOOP_KEY_PASSWORD }}
        run: |
          umask 077
          export SNACKLOOP_KEYSTORE_PATH="$RUNNER_TEMP/snackloop-release.jks"
          printf '%s' "$SNACKLOOP_KEYSTORE_BASE64" | base64 --decode > "$SNACKLOOP_KEYSTORE_PATH"
          gradle assembleRelease \
            -PsnackloopVersionCode="$((1000 + GITHUB_RUN_NUMBER))" \
            -PsnackloopVersionName="0.2.${GITHUB_RUN_NUMBER}"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && success()
        with:
          name: SnackLoop-update
          path: app/build/outputs/apk/release/app-release.apk
