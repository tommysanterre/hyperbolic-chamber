name: Android build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize releases so each main push sees the preceding release's tag.
# Keep pending pushes queued instead of replacing them with the newest push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && 'releases' || github.run_id }}
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
    env:
      SIGNING_CONFIGURED: ${{ secrets.SNACKLOOP_KEYSTORE_BASE64 != '' && secrets.SNACKLOOP_STORE_PASSWORD != '' && secrets.SNACKLOOP_KEY_ALIAS != '' && secrets.SNACKLOOP_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test release version selection
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Select APK version
        id: version
        if: github.event_name != 'pull_request'
        run: |
          release_tag=""
          version_name="0.2.${GITHUB_RUN_NUMBER}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release_tag="$GITHUB_REF_NAME"
            version_name="${release_tag#v}"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            release_tag="$(python3 .github/scripts/release_version.py)"
            version_name="${release_tag#v}"
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests
        if: github.event_name == 'pull_request'
        run: sh ./gradlew testDebugUnitTest
      - name: Check signing setup
        if: github.event_name != 'pull_request'
        run: |
          if [ "$SIGNING_CONFIGURED" != "true" ]; then
            echo "::error::Set the four SNACKLOOP signing secrets before publishing update APKs."
            exit 1
          fi
      - name: Run unit tests and build signed update APK
        if: github.event_name != 'pull_request'
        env:
          SNACKLOOP_KEYSTORE_BASE64: ${{ secrets.SNACKLOOP_KEYSTORE_BASE64 }}
          SNACKLOOP_STORE_PASSWORD: ${{ secrets.SNACKLOOP_STORE_PASSWORD }}
          SNACKLOOP_KEY_ALIAS: ${{ secrets.SNACKLOOP_KEY_ALIAS }}
          SNACKLOOP_KEY_PASSWORD: ${{ secrets.SNACKLOOP_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          umask 077
          export SNACKLOOP_KEYSTORE_PATH="$RUNNER_TEMP/snackloop-release.jks"
          printf '%s' "$SNACKLOOP_KEYSTORE_BASE64" | base64 --decode > "$SNACKLOOP_KEYSTORE_PATH"
          sh ./gradlew testDebugUnitTest assembleRelease \
            -PsnackloopVersionCode="$((1000 + GITHUB_RUN_NUMBER))" \
            -PsnackloopVersionName="$VERSION_NAME"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk
          mv app/build/outputs/apk/release/app-release.apk \
            "app/build/outputs/apk/release/Hyperbolic-Time-Chamber-v${VERSION_NAME}.apk"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && success()
        with:
          name: hyperbolic-update
          path: app/build/outputs/apk/release/Hyperbolic-Time-Chamber-*.apk
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && needs.build.outputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: hyperbolic-update
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            if git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
            else
              git tag "$RELEASE_TAG" "$GITHUB_SHA"
              git push origin "refs/tags/$RELEASE_TAG"
            fi
          fi
          apk="release/Hyperbolic-Time-Chamber-${RELEASE_TAG}.apk"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$apk" --clobber
          else
            gh release create "$RELEASE_TAG" "$apk" \
              --verify-tag \
              --title "Hyperbolic Time Chamber $RELEASE_TAG" \
              --generate-notes
          fi
          gh release view "$RELEASE_TAG" --json assets \
            --jq '.assets[].name' | grep -Fx "$(basename "$apk")"
